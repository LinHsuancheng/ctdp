appId: com.ctdp.desktop
productName: CTDP
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/icon.png
    to: icon.png
npmRebuild: false
win:
  target:
    - target: zip
      arch: [x64]
  icon: resources/icon.png
  # Editing the exe needs wine on Linux; skip it so we can build on hina.
  signAndEditExecutable: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
